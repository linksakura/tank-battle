<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克大战 Battle City</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a24;
    --border: #2a3a4d;
    --gold: #f2c14e;
    --text: #dce6f2;
    --dim: #7d8ea3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #16202c 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px;
  }
  h1 {
    font-size: 26px;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 2px 0 #000, 0 0 18px rgba(242,193,78,.35);
    font-weight: 800;
  }
  h1 .sub {
    display: block;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--dim);
    font-weight: 500;
    margin-top: 2px;
  }
  .stage {
    position: relative;
    background: #05080c;
    border: 3px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6), inset 0 0 0 1px #000;
    line-height: 0;
  }
  canvas { display: block; border-radius: 3px; image-rendering: pixelated; }
  .hud {
    display: flex;
    gap: 18px;
    width: 100%;
    max-width: 448px;
    justify-content: space-between;
    align-items: center;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    text-align: center;
    flex: 1;
  }
  .stat .k { font-size: 11px; color: var(--dim); letter-spacing: 2px; }
  .stat .v { font-size: 22px; font-weight: 700; margin-top: 2px; color: var(--gold); }
  .lives { display: flex; gap: 4px; }
  .lives span { font-size: 18px; }
  .hint {
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 1px;
    text-align: center;
  }
  .hint b { color: var(--text); }
  /* 触屏方向键 */
  .pad {
    display: none;
    grid-template-areas: ". up ." "left down right";
    gap: 6px;
    margin-top: 4px;
  }
  .pad button {
    width: 58px; height: 58px;
    font-size: 22px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .pad button:active { background: #1d2a3a; }
  .btn-up { grid-area: up; } .btn-down { grid-area: down; }
  .btn-left { grid-area: left; } .btn-right { grid-area: right; }
  .btn-fire { grid-area: down; justify-self: end; width: 58px; height: 58px;
    background: #3a1f1f; border-color: #7a3b3b; color: #ff8a8a; font-size: 26px; }
  .btn-fire:active { background: #5a2a2a; }
  @media (pointer: coarse) {
    .pad { display: grid; grid-template-columns: 58px 58px 58px; }
    .pad .btn-fire { justify-self: start; }
    .hint.desktop { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>坦克大战<span class="sub">BATTLE CITY</span></h1>
  <div class="hud">
    <div class="stat"><div class="k">分数</div><div class="v" id="score">0</div></div>
    <div class="stat"><div class="k">关卡</div><div class="v" id="level">1</div></div>
    <div class="stat"><div class="k">生命</div><div class="lives" id="lives">🟡🟡🟡</div></div>
    <div class="stat"><div class="k">剩余敌人</div><div class="v" id="left">10</div></div>
  </div>
  <div class="stage"><canvas id="game" width="416" height="416"></canvas></div>
  <div class="hint desktop">
    <b>方向键 / WASD</b> 移动 &nbsp;·&nbsp; <b>空格 / J</b> 射击 &nbsp;·&nbsp; <b>P</b> 暂停
  </div>
  <div class="pad">
    <button class="btn-up" data-k="up">▲</button>
    <button class="btn-left" data-k="left">◀</button>
    <button class="btn-fire" data-k="fire">●</button>
    <button class="btn-right" data-k="right">▶</button>
    <button class="btn-down" data-k="down">▼</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- 常量 ----------
  const TILE = 32;
  const COLS = 13, ROWS = 13;
  const DIRS = [
    { dx: 0, dy: -1 }, // 0 上
    { dx: 1, dy: 0  }, // 1 右
    { dx: 0, dy: 1  }, // 2 下
    { dx: -1, dy: 0 }, // 3 左
  ];
  const ANGLE = [0, Math.PI / 2, Math.PI, -Math.PI / 2];

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const elScore = document.getElementById("score");
  const elLevel = document.getElementById("level");
  const elLives = document.getElementById("lives");
  const elLeft  = document.getElementById("left");

  // ---------- 关卡地图 ----------
  // . 空  # 砖(可破坏)  S 钢(不可破坏)  ~ 水  G 草丛  B 基地
  const LEVEL = [
    ".............",
    "..##.....##..",
    "..##.....##..",
    ".....GGG.....",
    "##..#####..##",
    "##..#SSS#..##",
    ".............",
    "...##...##...",
    "...##...##...",
    ".............",
    "..#...###..#.",
    "..#...###..#.",
    ".....###.....",
  ];

  // ---------- 游戏状态 ----------
  let map = [];
  let player = null;
  let enemies = [];
  let bullets = [];
  let particles = [];
  let score = 0;
  let lives = 3;
  let levelNum = 1;
  let enemiesTotal = 10;
  let enemiesSpawned = 0;
  let enemiesLeft = 10;
  let baseAlive = true;
  let state = "title"; // title | playing | gameover | win | paused
  let spawnTimer = 0;
  let lastTime = 0;
  let keys = {};
  let firePressed = false;
  let fireLock = false;

  const SPAWNS = [ {c:0, r:0}, {c:6, r:0}, {c:12, r:0} ];
  const BASE = { c: 6, r: 12 };

  // ---------- 音效 ----------
  let audio = null;
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { audio = null; }
  function beep(freq, dur, type, vol) {
    if (!audio) return;
    try {
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      o.connect(g); g.connect(audio.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  const sfxShoot = () => beep(220, 0.06, "square", 0.06);
  const sfxHit   = () => beep(90, 0.18, "sawtooth", 0.12);
  const sfxBoom  = () => beep(50, 0.35, "sawtooth", 0.16);
  const sfxBase  = () => beep(40, 0.6, "sawtooth", 0.2);

  // ---------- 地图工具 ----------
  function loadMap() {
    map = LEVEL.map(row => row.split(""));
    map[BASE.r][BASE.c] = "B";
  }
  function tileAt(c, r) {
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return "X";
    return map[r][c];
  }
  function rectHits(rect, tiles) {
    const c0 = Math.floor(rect.x / TILE);
    const c1 = Math.floor((rect.x + rect.w - 1) / TILE);
    const r0 = Math.floor(rect.y / TILE);
    const r1 = Math.floor((rect.y + rect.h - 1) / TILE);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const t = tileAt(c, r);
        if (t === "X" || tiles.indexOf(t) >= 0) return true;
      }
    }
    return false;
  }
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ---------- 实体 ----------
  function makeTank(x, y, dir, kind) {
    return {
      x, y, dir, kind,          // kind: 'player' | 'enemy'
      size: TILE,
      speed: kind === "player" ? 2.2 : 1.4,
      hp: kind === "player" ? 1 : 1,
      shootCd: 0,
      aiTimer: 0,
      flash: 0,
    };
  }
  function tankRect(t) {
    return { x: t.x, y: t.y, w: t.size, h: t.size };
  }

  function spawnPlayer() {
    player = makeTank(4 * TILE, 12 * TILE, 0, "player");
    player.shootCd = 0;
  }

  function spawnEnemy() {
    const pt = SPAWNS[Math.floor(Math.random() * SPAWNS.length)];
    const e = makeTank(pt.c * TILE, pt.r * TILE, 2, "enemy");
    // 若出生点被占，稍后再试
    const rect = tankRect(e);
    if (rectHits(rect, ["#", "S", "~", "B"])) return false;
    for (const t of enemies) if (rectsOverlap(rect, tankRect(t))) return false;
    if (player && rectsOverlap(rect, tankRect(player))) return false;
    enemies.push(e);
    enemiesSpawned++;
    return true;
  }

  function resetGame() {
    loadMap();
    enemies = [];
    bullets = [];
    particles = [];
    score = 0;
    lives = 3;
    levelNum = 1;
    enemiesTotal = 10;
    enemiesSpawned = 0;
    enemiesLeft = 10;
    baseAlive = true;
    spawnTimer = 0;
    spawnPlayer();
    updateHUD();
  }

  // ---------- 输入 ----------
  function shoot(t) {
    if (!t) return;
    if (t.kind === "player" && (t.shootCd > 0 || state !== "playing")) return;
    const d = DIRS[t.dir];
    const cx = t.x + t.size / 2, cy = t.y + t.size / 2;
    const bx = cx + d.dx * (t.size / 2 + 3) - 3;
    const by = cy + d.dy * (t.size / 2 + 3) - 3;
    // 限制玩家同时在场子弹数
    const myBullets = bullets.filter(b => b.owner === t);
    if (t.kind === "player" && myBullets.length >= 2) return;
    bullets.push({
      x: bx, y: by, w: 6, h: 6,
      dx: d.dx, dy: d.dy,
      speed: 6,
      owner: t,
    });
    t.shootCd = t.kind === "player" ? 14 : 40 + Math.random() * 40;
    sfxShoot();
  }

  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === " " || k === "j") { e.preventDefault(); firePressed = true; }
    if (k === "p") { if (state === "playing") state = "paused"; else if (state === "paused") state = "playing"; }
    if (k === "enter") { if (state === "title" || state === "gameover" || state === "win") { resetGame(); state = "playing"; } }
  });
  document.addEventListener("keyup", e => {
    const k = e.key.toLowerCase();
    keys[k] = false;
    if (k === " " || k === "j") firePressed = false;
  });

  // 触屏
  document.querySelectorAll(".pad button").forEach(btn => {
    const isFire = btn.dataset.k === "fire";
    const down = e => { e.preventDefault(); if (isFire) firePressed = true; else keys[btn.dataset.k] = true; };
    const up   = e => { e.preventDefault(); if (isFire) firePressed = false; else keys[btn.dataset.k] = false; };
    btn.addEventListener("touchstart", down);
    btn.addEventListener("touchend", up);
    btn.addEventListener("mousedown", down);
    btn.addEventListener("mouseup", up);
    btn.addEventListener("mouseleave", up);
  });

  // ---------- 更新 ----------
  function updatePlayer() {
    if (!player || state !== "playing") return;
    let d = -1;
    if (keys["arrowup"] || keys["w"]) d = 0;
    else if (keys["arrowright"] || keys["d"]) d = 1;
    else if (keys["arrowdown"] || keys["s"]) d = 2;
    else if (keys["arrowleft"] || keys["a"]) d = 3;
    if (d >= 0) {
      player.dir = d;
      const dir = DIRS[d];
      const nx = player.x + dir.dx * player.speed;
      const ny = player.y + dir.dy * player.speed;
      const nr = { x: nx, y: ny, w: player.size, h: player.size };
      if (!rectHits(nr, ["#", "S", "~", "B"]) && !hitsAnyTank(nr, player)) {
        player.x = nx; player.y = ny;
      }
    }
    if (firePressed && !fireLock) { shoot(player); fireLock = true; }
    if (!firePressed) fireLock = false;
    if (player.shootCd > 0) player.shootCd--;
  }

  function hitsAnyTank(rect, self) {
    if (player && player !== self && rectsOverlap(rect, tankRect(player))) return true;
    for (const e of enemies) if (e !== self && rectsOverlap(rect, tankRect(e))) return true;
    return false;
  }

  function updateEnemies() {
    for (const e of enemies) {
      if (e.hp <= 0) continue;
      if (e.shootCd > 0) e.shootCd--;
      if (e.flash > 0) e.flash--;

      // AI：随机转向
      e.aiTimer--;
      const tryShoot = e.shootCd <= 0 && Math.random() < 0.025;
      if (e.aiTimer <= 0) {
        // 面向玩家优先概率
        let preferred = -1;
        if (player && Math.random() < 0.35) {
          const dx = player.x - e.x, dy = player.y - e.y;
          if (Math.abs(dx) > Math.abs(dy)) preferred = dx > 0 ? 1 : 3;
          else preferred = dy > 0 ? 2 : 0;
        }
        const choices = [0, 1, 2, 3].filter(d => d !== (e.dir + 2) % 4);
        e.dir = preferred >= 0 && Math.random() < 0.7 ? preferred : choices[Math.floor(Math.random() * choices.length)];
        e.aiTimer = 40 + Math.random() * 90;
      }

      const dir = DIRS[e.dir];
      const nx = e.x + dir.dx * e.speed;
      const ny = e.y + dir.dy * e.speed;
      const nr = { x: nx, y: ny, w: e.size, h: e.size };
      if (!rectHits(nr, ["#", "S", "~", "B"]) && !hitsAnyTank(nr, e)) {
        e.x = nx; e.y = ny;
      } else {
        e.aiTimer = 0; // 被挡则下次立刻转向
      }
      if (tryShoot) shoot(e);
    }
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.dx * b.speed;
      b.y += b.dy * b.speed;
      const r = { x: b.x, y: b.y, w: b.w, h: b.h };

      // 出界
      if (b.x < -TILE || b.y < -TILE || b.x > COLS * TILE || b.y > ROWS * TILE) {
        bullets.splice(i, 1); continue;
      }
      // 命中地图
      const c = Math.floor((b.x + b.w / 2) / TILE);
      const rr = Math.floor((b.y + b.h / 2) / TILE);
      const t = tileAt(c, rr);
      let dead = false;
      if (t === "#") {
        map[rr][c] = ".";
        spawnParticles(c * TILE + 16, rr * TILE + 16, "#b07a3f");
        sfxHit(); dead = true;
      } else if (t === "S") {
        spawnParticles(b.x + 3, b.y + 3, "#9fb3c8");
        sfxHit(); dead = true;
      } else if (t === "B") {
        destroyBase(); dead = true;
      } else if (t === "X") {
        dead = true;
      }
      if (dead) { bullets.splice(i, 1); continue; }

      // 命中坦克
      let hitTank = null;
      if (b.owner !== player && player && player.hp > 0 && rectsOverlap(r, tankRect(player))) hitTank = player;
      else {
        for (const e of enemies) {
          if (e !== b.owner && e.hp > 0 && rectsOverlap(r, tankRect(e))) { hitTank = e; break; }
        }
      }
      if (hitTank) {
        hitTank.hp--;
        spawnParticles(hitTank.x + 16, hitTank.y + 16, "#ffd166");
        sfxBoom();
        if (hitTank.hp <= 0) {
          if (hitTank.kind === "enemy") {
            removeEnemy(hitTank);
            score += 100; updateHUD();
            spawnParticles(hitTank.x + 16, hitTank.y + 16, "#ff6b6b");
          } else {
            playerDeath();
          }
        }
        bullets.splice(i, 1);
      }
    }
  }

  function removeEnemy(e) {
    enemies = enemies.filter(x => x !== e);
    enemiesLeft = Math.max(0, enemiesTotal - enemiesSpawned);
    // 剩余敌人 = 未生成 + 场上存活
    enemiesLeft += enemies.length;
    updateHUD();
  }

  function playerDeath() {
    player = null;
    lives--;
    updateHUD();
    if (lives <= 0) { state = "gameover"; }
    else { spawnPlayer(); }
  }

  function destroyBase() {
    if (!baseAlive) return;
    baseAlive = false;
    map[BASE.r][BASE.c] = ".";
    spawnParticles(BASE.c * TILE + 16, BASE.r * TILE + 16, "#ff6b6b");
    sfxBase();
    state = "gameover";
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        life: 20 + Math.random() * 10,
        color,
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function updateSpawns() {
    if (enemiesSpawned >= enemiesTotal) return;
    const alive = enemies.filter(e => e.hp > 0).length;
    if (alive >= 3) return;
    spawnTimer--;
    if (spawnTimer <= 0) {
      if (spawnEnemy()) spawnTimer = 120;
      else spawnTimer = 20;
    }
    enemiesLeft = (enemiesTotal - enemiesSpawned) + enemies.length;
  }

  function updateHUD() {
    elScore.textContent = score;
    elLevel.textContent = levelNum;
    elLeft.textContent = enemiesLeft;
    elLives.innerHTML = "🟡".repeat(Math.max(0, lives));
  }

  function update() {
    if (state !== "playing") return;
    updatePlayer();
    updateEnemies();
    updateBullets();
    updateParticles();
    updateSpawns();
    // 过关
    if (enemiesLeft <= 0 && enemies.length === 0 && enemiesSpawned >= enemiesTotal) {
      nextLevel();
    }
  }

  function nextLevel() {
    levelNum++;
    enemiesTotal += 2;
    enemiesSpawned = 0;
    enemiesLeft = enemiesTotal;
    enemies = [];
    bullets = [];
    loadMap();
    spawnPlayer();
    updateHUD();
  }

  // ---------- 渲染 ----------
  function drawTile(c, r) {
    const t = tileAt(c, r);
    const x = c * TILE, y = r * TILE;
    switch (t) {
      case "#":
        ctx.fillStyle = "#b07a3f";
        ctx.fillRect(x, y, TILE, TILE);
        ctx.strokeStyle = "#7a4a22";
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
        ctx.beginPath();
        ctx.moveTo(x, y + TILE / 2); ctx.lineTo(x + TILE, y + TILE / 2);
        ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + TILE);
        ctx.strokeStyle = "rgba(0,0,0,.25)";
        ctx.stroke();
        break;
      case "S":
        ctx.fillStyle = "#7f95ad";
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = "#9fb3c8";
        ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = "#5d7088";
        ctx.fillRect(x + TILE / 2 - 3, y + TILE / 2 - 3, 6, 6);
        break;
      case "~":
        ctx.fillStyle = "#1f4f7a";
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = "#3f8fd6";
        ctx.fillRect(x + 2, y + TILE / 2 - 1, TILE - 4, 2);
        ctx.fillRect(x + 6, y + TILE / 2 + 4, TILE - 12, 2);
        break;
      case "B":
        drawBase(x, y);
        break;
      default:
        ctx.fillStyle = "#05080c";
        ctx.fillRect(x, y, TILE, TILE);
    }
  }

  function drawBase(x, y) {
    if (!baseAlive) {
      ctx.fillStyle = "#05080c";
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = "#555";
      ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
      return;
    }
    ctx.fillStyle = "#e8e8e8";
    ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
    ctx.fillStyle = "#3a3a3a";
    ctx.fillRect(x + 12, y + 12, TILE - 24, TILE - 24);
    // 鹰
    ctx.fillStyle = "#f2c14e";
    ctx.beginPath();
    ctx.moveTo(x + 16, y + 15);
    ctx.lineTo(x + 19, y + 20);
    ctx.lineTo(x + 16, y + 18);
    ctx.lineTo(x + 13, y + 20);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(x + 15, y + 20, 2, 3);
  }

  function drawTank(t) {
    if (!t) return;
    ctx.save();
    ctx.translate(t.x + t.size / 2, t.y + t.size / 2);
    ctx.rotate(ANGLE[t.dir]);
    const isPlayer = t.kind === "player";
    const flash = t.flash > 0 && (t.flash % 4 < 2);
    const body = flash ? "#ffffff" : (isPlayer ? "#f2c14e" : "#c0504d");
    const track = flash ? "#ffffff" : (isPlayer ? "#8a6a1f" : "#6a2a28");
    const s = t.size;
    // 履带
    ctx.fillStyle = track;
    ctx.fillRect(-s / 2, -s / 2, 8, s);
    ctx.fillRect(s / 2 - 8, -s / 2, 8, s);
    // 车体
    ctx.fillStyle = body;
    ctx.fillRect(-s / 2 + 6, -s / 2 + 6, s - 12, s - 12);
    // 炮管
    ctx.fillStyle = flash ? "#ffffff" : (isPlayer ? "#b8860b" : "#4a1a18");
    ctx.fillRect(-3, -s / 2 - 4, 6, 10);
    // 炮塔
    ctx.fillStyle = flash ? "#ffffff" : (isPlayer ? "#e0a526" : "#a0302c");
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawGrass() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (map[r][c] === "G") {
          const x = c * TILE, y = r * TILE;
          ctx.fillStyle = "rgba(60,130,70,.65)";
          for (let i = 0; i < 6; i++) {
            const gx = x + 3 + (i % 3) * 9;
            const gy = y + 3 + Math.floor(i / 3) * 14;
            ctx.fillRect(gx, gy, 3, 8);
          }
        }
      }
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life / 30;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(text, sub) {
    ctx.fillStyle = "rgba(0,0,0,.72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f2c14e";
    ctx.font = "bold 34px 'Segoe UI','Microsoft YaHei',sans-serif";
    ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 8);
    ctx.fillStyle = "#dce6f2";
    ctx.font = "15px 'Segoe UI','Microsoft YaHei',sans-serif";
    ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 24);
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        drawTile(c, r);
    drawTank(player);
    for (const e of enemies) drawTank(e);
    drawGrass();
    for (const b of bullets) {
      ctx.fillStyle = "#f7f7f7";
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
    drawParticles();

    if (state === "title") drawOverlay("坦克大战", "按 Enter 开始游戏");
    else if (state === "gameover") drawOverlay("游戏结束", "按 Enter 重新开始 · 分数 " + score);
    else if (state === "win") drawOverlay("胜利！", "按 Enter 再来一局");
    else if (state === "paused") drawOverlay("已暂停", "按 P 继续");
  }

  // ---------- 主循环 ----------
  function loop(t) {
    requestAnimationFrame(loop);
    const dt = lastTime ? (t - lastTime) : 16;
    lastTime = t;
    // 固定步长累积（简单起见直接按帧更新）
    update();
    render();
  }

  loadMap();
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
